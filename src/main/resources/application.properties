spring.application.name=wealthwise

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wealthwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate — safe production defaults
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=${PORT:8080}

# Caching Configuration
spring.cache.type=simple
spring.cache.redis.time-to-live=15m
spring.cache.redis.cache-null-values=false

# Market API Configurations
application.market.finnhub.url=https://finnhub.io/api/v1
application.market.finnhub.token=${FINNHUB_TOKEN}

# JWT — no default fallback; app will fail to start if secret is missing
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger — disabled in production; enable via dev profile
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false