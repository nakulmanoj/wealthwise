# ─────────────────────────────────────────────────────────────
# Dev profile — override production defaults for local dev only
# Activate with: -Dspring.profiles.active=dev
# ─────────────────────────────────────────────────────────────

# Allow Hibernate to auto-update schema in dev
spring.jpa.hibernate.ddl-auto=update

# Print SQL to console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger enabled in dev
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Relaxed rate limits for local development (won't block dev testing)
auth.rate-limit.requests=100
auth.rate-limit.minutes=1
