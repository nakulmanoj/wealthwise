<div class="login-wrapper fade-in">
  <div class="login-card glass-panel">
    <div class="login-header">
      <h1 class="gradient-text brand-title">WealthWise</h1>
      <p class="login-subtitle">Securely manage your personal finances</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div *ngIf="errorMessage" class="alert-message">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="yourname@example.com"
          [(ngModel)]="credentials.email"
          required
          email
          #emailField="ngModel"
        />
        <div *ngIf="emailField.touched && emailField.invalid" class="validation-message">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="••••••••"
          [(ngModel)]="credentials.password"
          required
          #passwordField="ngModel"
        />
        <div *ngIf="passwordField.touched && passwordField.invalid" class="validation-message">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <div class="login-footer">
      <span>Don't have an account?</span>
      <a routerLink="/register" class="link-register">Create Account</a>
    </div>
  </div>
</div>
