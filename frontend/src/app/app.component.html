<div class="app-container" [class.authenticated]="apiService.isLoggedIn()">
  <!-- Sidebar Navigation -->
  <aside class="app-sidebar glass-panel" *ngIf="apiService.isLoggedIn()">
    <div class="sidebar-brand">
      <span class="gradient-text brand-title">WealthWise</span>
    </div>
    
    <div class="sidebar-user">
      <div class="user-avatar">{{ apiService.getUserName().charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <span class="user-name">{{ apiService.getUserName() }}</span>
        <span class="user-email">{{ apiService.getUserEmail() }}</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <!-- Bar Chart -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></svg>
        </span>
        <span>Dashboard</span>
      </a>
      <a routerLink="/transactions" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <!-- Arrows (exchange) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </span>
        <span>Transactions</span>
      </a>
      <a routerLink="/budgets" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <!-- Target / Bullseye -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </span>
        <span>Budgets</span>
      </a>
      <a routerLink="/investments" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <!-- Trending Up -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        </span>
        <span>Investments</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <!-- User -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="btn-logout">
        <span class="nav-icon">
          <!-- Log Out -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Viewport Content -->
  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
